<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mentes Pensantes</title>
  <meta name="description" content="Mentes Pensantes: nem todo convite merece ser aceito.">
  <link rel="icon" href="assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/cena/fundo.jpg">
  <link rel="preload" as="image" href="assets/mascote/natal.webp">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>

  <!-- ============ PORTÃO (primeiro toque libera o som) ============ -->
  <section id="portao" class="tela" hidden>
    <button id="comecar" class="comecar">
      <span class="comecar-icone" aria-hidden="true">?</span>
      <span>Toque para começar</span>
    </button>
  </section>

  <!-- ============ TELA PRINCIPAL: a mansão ============ -->
  <section id="hub" class="tela" hidden>

    <!-- Cenário em camadas (coordenadas da arte: 1672 × 941). A câmera move este bloco inteiro. -->
    <div class="cena" id="cena" aria-hidden="true">
      <img class="cena-fundo" src="assets/cena/fundo.jpg" alt="" draggable="false">
      <div class="brilho lua"></div>
      <div class="brilho janela j1"></div>
      <div class="brilho janela j2"></div>
      <div class="brilho janela j3"></div>
      <div class="brilho janela j4"></div>
      <div class="brilho porta"></div>
      <div class="luzes" id="luzes"></div>
      <div class="nevoa-chao n1"></div>
      <div class="nevoa-chao n2"></div>
      <div class="mascote" id="mascote"></div>
      <div class="nevoa-chao n3"></div>
    </div>

    <canvas class="neve" id="neve" aria-hidden="true"></canvas>
    <div class="vinheta" aria-hidden="true"></div>

    <!-- Interface: texto real e clicável, separado do fundo -->
    <div class="ui" id="ui">
      <h1 class="placa-logo"><img src="assets/cena/placa-logo.png" alt="Mentes Pensantes" draggable="false"></h1>
      <p class="lema">Nem todo convite merece ser aceito.</p>
      <button id="btn-jogar" class="tabua t1" type="button"><span>Jogar com amigos</span></button>
      <button id="btn-codigo" class="tabua t2" type="button"><span>Entrar com código</span></button>
      <div class="casos-lista" id="casos-lista" role="group" aria-label="Escolha seu caso"></div>
    </div>

    <div class="icones-topo">
      <button id="btn-som" class="icone" type="button" aria-label="Som ligado" aria-pressed="false">
        <img src="assets/cena/icone-som.png" alt="" draggable="false"><i class="risco" aria-hidden="true"></i>
      </button>
      <button id="btn-config" class="icone" type="button" aria-label="Configurações">
        <img src="assets/cena/icone-config.png" alt="" draggable="false">
      </button>
    </div>

    <div class="balao" id="balao" hidden>
      <p class="balao-texto"></p>
    </div>

    <!-- Painel de sala (o convite se transforma nele) -->
    <div class="painel-fundo" id="painel-fundo" hidden></div>
    <section class="painel-sala" id="painel-sala" hidden role="dialog" aria-modal="true" aria-labelledby="ps-titulo">
      <div class="ps-selo" aria-hidden="true">M</div>
      <button class="ps-fechar" type="button" aria-label="Fechar">×</button>
      <header class="ps-cabecalho">
        <img class="ps-capa" src="assets/cena/placa-caso.png" alt="">
        <div>
          <p class="ps-rotulo">Caso selecionado</p>
          <h2 id="ps-titulo"></h2>
          <p class="ps-tema"></p>
        </div>
      </header>
      <p class="ps-frase">Você foi convidado. <strong>Álibi não incluso.</strong></p>
      <div class="ps-abas" role="tablist" aria-label="Como você quer jogar">
        <button type="button" role="tab" id="aba-criar" aria-controls="ps-criar" data-aba="criar">Criar sala</button>
        <button type="button" role="tab" id="aba-entrar" aria-controls="ps-entrar" data-aba="entrar">Entrar com código</button>
      </div>
      <form id="ps-criar" class="ps-form" role="tabpanel" aria-labelledby="aba-criar">
        <label>Seu nome <input name="nome" maxlength="24" autocomplete="nickname" required></label>
        <label>Participantes
          <select name="max"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option></select>
        </label>
        <button class="botao" type="submit">Criar sala</button>
      </form>
      <form id="ps-entrar" class="ps-form" role="tabpanel" aria-labelledby="aba-entrar" hidden>
        <label>Seu nome <input name="nome" maxlength="24" autocomplete="nickname" required></label>
        <label>Código da sala <input name="codigo" class="codigo" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
        <button class="botao" type="submit">Entrar</button>
      </form>
      <p class="ps-aviso" role="status" hidden></p>
      <button class="ps-trocar" type="button">Trocar de caso</button>
    </section>

    <div class="clarao" id="clarao" aria-hidden="true"></div>
    <button class="pular" id="pular-seq" type="button" hidden>Pular ›</button>
  </section>

  <!-- ============ CONFIGURAÇÕES ============ -->
  <dialog id="config" aria-labelledby="config-titulo">
    <form method="dialog" class="painel-config">
      <h2 id="config-titulo">Configurações</h2>
      <label class="linha">Volume da música
        <input type="range" min="0" max="100" step="5" name="musica"><output></output>
      </label>
      <label class="linha">Volume dos efeitos e do vento
        <input type="range" min="0" max="100" step="5" name="efeitos"><output></output>
      </label>
      <label class="linha alternar">Movimento reduzido
        <input type="checkbox" name="reduzido">
      </label>
      <fieldset class="linha">
        <legend>Tamanho do texto</legend>
        <div class="segmentos">
          <label><input type="radio" name="texto" value="p" aria-label="Texto pequeno"><span>A</span></label>
          <label><input type="radio" name="texto" value="m" aria-label="Texto médio"><span>A</span></label>
          <label><input type="radio" name="texto" value="g" aria-label="Texto grande"><span>A</span></label>
        </div>
      </fieldset>
      <button class="botao" value="ok">Fechar</button>
    </form>
  </dialog>

  <script src="js/ajustes.js"></script>
  <script src="js/som-hub.js"></script>
  <script src="js/mascote-rig.js"></script>
  <script src="js/neve.js"></script>
  <script src="js/reacao-botao.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/telacheia.js"></script>
</body>
</html>
